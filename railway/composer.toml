# Railway config-as-code for the composer (Settings → Config-as-code → Railway config file: /railway/composer.toml).
# The same build and teardown as /railway.toml (scripts/railway-config.test.mjs keeps them equal) plus a healthcheck:
# traffic moves to a new deployment only once GET /health answers 2xx (503 while its database is unavailable).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 15
drainingSeconds = 60
