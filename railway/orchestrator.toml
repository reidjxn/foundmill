# Railway config-as-code for the orchestrator (Settings → Config-as-code → Railway config file: /railway/orchestrator.toml).
# The same build (plus its own watch patterns) and teardown as /railway.toml (scripts/railway-config.test.mjs keeps them
# equal) plus a healthcheck: the orchestrator serves GET /ready on PORT (apps/orchestrator/src/health-server.ts), 200
# once both workers run and the database answers, 503 before (Temporal not reachable yet). A new deployment takes over
# only once it answers, so a deploy that cannot reach Temporal leaves the old one running. Not /health: that one also
# fails on an old task-queue backlog, which a new deployment coming to clear a wedged queue must not be held back by.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Redeploy only when its app or a package it imports changes, or the image does (scripts/railway-watch.mjs; #222).
# The lists that count are in the service settings (Settings, Build, Watch Paths): Railway stops reading this file on
# Dec 1, 2026, and this copy is kept equal to the script by scripts/railway-config.test.mjs.
watchPatterns = ["/apps/orchestrator/**", "/infra/**", "/packages/agents/**", "/packages/config/**", "/packages/connectors/**", "/packages/db/**", "/packages/entity-linker/**", "/packages/events/**", "/packages/journey/**", "/packages/models/**", "/packages/policy/**", "/packages/sandbox/**", "/packages/shared/**", "/patches/**", "/Dockerfile", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/.npmrc"]

[deploy]
healthcheckPath = "/ready"
# Boot: bundling the workflows (about 20 s under tsx) and connecting to Temporal, with room to spare.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 60
