# Railway config-as-code for the stream (Settings → Config-as-code → Railway config file: /railway/stream.toml).
# The same build (plus its own watch patterns) and teardown as /railway.toml (scripts/railway-config.test.mjs keeps
# them equal) plus a healthcheck:
# traffic moves to a new deployment only once GET /health answers 2xx (503 without Redis or while shutting down).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Redeploy only when something this service runs changed (#222): its app, the shared packages, the image and the
# lockfile. A docs-only push, or one that touches only apps/web or another service, leaves it running.
watchPatterns = ["/apps/stream/**", "/packages/**", "/patches/**", "/Dockerfile", "/railway/stream.toml", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/.npmrc"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 60
