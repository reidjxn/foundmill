# Railway config-as-code for the api (Settings → Config-as-code → Railway config file: /railway/api.toml). The same
# build (plus its own watch patterns) and teardown as /railway.toml (scripts/railway-config.test.mjs keeps them equal)
# plus a healthcheck: a new deployment gets traffic only once GET /health answers 2xx, which the api does after
# migrations and `listen`, and
# only while its database answers (503 otherwise), so the previous deployment keeps serving until then (docs/DEPLOY.md §3).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Redeploy only when something this service runs changed (#222): its app, the shared packages, the image and the
# lockfile. A docs-only push, or one that touches only apps/web or another service, leaves it running.
watchPatterns = ["/apps/api/**", "/packages/**", "/patches/**", "/Dockerfile", "/railway/api.toml", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/.npmrc"]

[deploy]
healthcheckPath = "/health"
# Boot (about 10 s under tsx) plus the migration lock wait (MIGRATION_LOCK_TIMEOUT_MS, 60 s), with room to spare.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 60
