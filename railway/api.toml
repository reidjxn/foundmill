# Railway config-as-code for the api (Settings → Config-as-code → Railway config file: /railway/api.toml). The same
# build (plus its own watch patterns) and teardown as /railway.toml (scripts/railway-config.test.mjs keeps them equal)
# plus a healthcheck: a new deployment gets traffic only once GET /health answers 2xx, which the api does after
# migrations and `listen`, and
# only while its database answers (503 otherwise), so the previous deployment keeps serving until then (docs/DEPLOY.md §3).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Redeploy only when its app or a package it imports changes, or the image does (scripts/railway-watch.mjs; #222).
# The lists that count are in the service settings (Settings, Build, Watch Paths): Railway stops reading this file on
# Dec 1, 2026, and this copy is kept equal to the script by scripts/railway-config.test.mjs.
watchPatterns = ["/apps/api/**", "/packages/agents/**", "/packages/config/**", "/packages/connectors/**", "/packages/db/**", "/packages/entity-linker/**", "/packages/events/**", "/packages/journey/**", "/packages/models/**", "/packages/policy/**", "/packages/shared/**", "/patches/**", "/Dockerfile", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/.npmrc"]

[deploy]
healthcheckPath = "/health"
# Boot (about 10 s under tsx) plus the migration lock wait (MIGRATION_LOCK_TIMEOUT_MS, 60 s), with room to spare.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 60
