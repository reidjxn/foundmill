# Railway config-as-code for the api (Settings → Config-as-code → Railway config file: /railway/api.toml). The same
# build and teardown as /railway.toml (scripts/railway-config.test.mjs keeps them equal) plus a healthcheck: a new
# deployment gets traffic only once GET /health answers 2xx, which the api does after migrations and `listen`, and
# only while its database answers (503 otherwise), so the previous deployment keeps serving until then (docs/DEPLOY.md §3).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
# Boot (about 10 s under tsx) plus the migration lock wait (MIGRATION_LOCK_TIMEOUT_MS, 60 s), with room to spare.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 15
drainingSeconds = 60
