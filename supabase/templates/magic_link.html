<h2>Sign in to Foundmill</h2>
<p>Tap the link to sign in on this device, or enter the code in the app.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?confirmation_url={{ .ConfirmationURL }}">Sign in to Foundmill</a></p>
<p>Your sign-in code: <strong style="font-size: 20px; letter-spacing: 3px;">{{ .Token }}</strong></p>
<p>The link and the code work once and expire in 15 minutes. If you did not ask to sign in, you can ignore this email.</p>
