# Railway config-as-code for the backend services (same Dockerfile; the APP variable selects the service).
# Railway reads this file for existing services until 2026-12-01, when config-as-code stops being read (docs/DEPLOY.md §3).
# The orchestrator uses this file as is: it serves no HTTP, so it has no healthcheck. api, gateway, composer, stream and
# ingest each point their "Railway config file" setting at /railway/<service>.toml, which repeats everything below and
# adds `healthcheckPath = "/health"` (scripts/railway-config.test.mjs keeps the copies equal).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Redeploys (docs/DEPLOY.md §3 "Redeploys and shutdown"). The previous deployment keeps running this long after the new
# one is up, so there is no gap while the new one boots (two orchestrator workers on one task queue, two outbox relays
# with `skip locked` are both fine).
overlapSeconds = 15
# Then it gets SIGTERM, and SIGKILL this long after. Each service drains within SHUTDOWN_TIMEOUT_MS (45 s by default:
# in-flight requests and streamed answers, WebSockets closed with 1001, the Temporal worker's activities given 30 s to
# finish) and exits; keep this above SHUTDOWN_TIMEOUT_MS.
drainingSeconds = 60
