# Security fixes for packages pinned deep in the tree. dompurify: monaco-editor (the design system's code editor) pins
# 3.4.15, inside GHSA advisories fixed in 3.4.17 (a critical SAFE_FOR_TEMPLATES bypass among them; pnpm audit, Nov 14).
overrides:
  dompurify: 3.4.17
  # zod: every copy at 4.6.7 (GHSA-mrhx-c7xc-m3w5); eslint-plugin-react-hooks pulled in 4.6.5, which scanners keep flagging.
  zod: 4.6.7

patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
