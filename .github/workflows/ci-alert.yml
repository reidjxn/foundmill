# A red main opens an issue (WP-01 T2; audit a10 EH-06: a red main once went unnoticed for five hours). A second failure
# comments on the same open issue; a person closes it when main is green again. Not `cancelled`: a waiting main run that
# a newer push replaces ends cancelled, which is normal. A workflow_run workflow runs main's copy with the repository
# token; it runs no code from the commit it reports on, only scripts/open-or-update-issue.sh from main.
name: CI alert

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf 'CI failed on main at %s\n%s\n' "$SHA" "$RUN_URL" > body.md
          bash scripts/open-or-update-issue.sh ci-red-main "CI is red on main" body.md
