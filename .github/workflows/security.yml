# Security scans (item 4 of the Claude Code tips review; security audit Nov 13, 2026). Not a required check yet: a
# finding shows here and in the job's summary without blocking a merge, until the existing findings are triaged and
# the coordinator makes it required.
#   - Secret scan: gitleaks on the commits a pull request or push adds, with .gitleaks.toml's reviewed allowlist (invented
#     keys in tests, fixtures and mocks; keys read from the environment). A key anywhere else fails the job.
#   - Dependency audit: `pnpm audit` from the lockfile. Every advisory goes in the job's summary; the job fails on a
#     critical one in a production dependency.
name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, the commits this change adds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (pinned, checksum checked)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$SHA"
          else
            RANGE="$SHA~1..$SHA"
          fi
          echo "Scanning $RANGE"
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE"

  dependencies:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every advisory, in the job summary
        run: |
          { echo "## pnpm audit (all dependencies)"; echo '```'; pnpm audit || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a critical advisory in a production dependency
        run: pnpm audit --prod --audit-level critical
